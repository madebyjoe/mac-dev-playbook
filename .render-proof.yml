---
# Throwaway harness: render every bind-carrying template for a host so the
# MDP-4 transport refactor can be proven byte-identical on `mac-headless`.
- name: Render bind-carrying templates
  hosts: all
  connection: local
  gather_facts: true
  become: false
  vars:
    out_dir: "{{ lookup('env', 'RENDER_OUT') }}"
    # Stand-ins for the vars main.yml sets; fixed so only the BIND can vary.
    whisper_models_dir: /Users/x/.cache/whisper/models
    whisper_model_file: ggml-large-v3-turbo.bin
    whisper_work_dir: /Users/x/.cache/whisper/run
    whisper_log_dir: /Users/x/Library/Logs/transcribe
    transcribe_port: 8082
    llamacpp_label: demo
    llamacpp_model_path: /Users/x/.cache/llamacpp/models/demo.gguf
    llamacpp_port: 8091
    llamacpp_log_dir: /Users/x/Library/Logs/llamacpp
    ollama_log_dir: /Users/x/Library/Logs/ollama
  pre_tasks:
    - name: Load local addressing (.env)
      ansible.builtin.import_tasks: "{{ playbook_dir }}/tasks/load-local-env.yml"
  tasks:
    - name: Render ollama pipeline plist
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/ollama.plist.j2"
        dest: "{{ out_dir }}/{{ inventory_hostname }}.ollama-serve.plist"
        mode: '0644'

    - name: Render ollama dev plist
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/ollama.plist.j2"
        dest: "{{ out_dir }}/{{ inventory_hostname }}.ollama-dev.plist"
        mode: '0644'
      vars:
        ollama_label: com.ollama.dev
        ollama_instance_bind: "{{ ollama_dev_bind }}"
        ollama_instance_keep_alive: "{{ ollama_dev_keep_alive | default('10m') }}"
        ollama_instance_max_loaded: "{{ ollama_dev_max_loaded_models | default(1) }}"
        ollama_instance_log_name: ollama-dev
      when: ollama_dev_enabled | default(false) | bool

    - name: Render transcribe plist
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/transcribe.plist.j2"
        dest: "{{ out_dir }}/{{ inventory_hostname }}.transcribe.plist"
        mode: '0644'

    - name: Render llamacpp plist
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/llamacpp-server.plist.j2"
        dest: "{{ out_dir }}/{{ inventory_hostname }}.llamacpp.plist"
        mode: '0644'
