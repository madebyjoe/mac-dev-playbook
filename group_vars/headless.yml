# NOTE: Ollama bind address and the model list are NOT set here. Per Brief F4,
# inference configuration (bind, keep-alive, model selection) keys off
# inference-role groups (inference_small / inference_medium), never off the
# headless profile. The bind defaults to loopback (127.0.0.1:11434); a role
# group overrides `ollama_bind` with the host's Tailscale IP. The old flat
# `ollama_models` list is replaced by the storage-aware manifest in Phase 3.
