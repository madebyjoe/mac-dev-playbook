---
# Inference role: MEDIUM node (F4 — e.g. M4 Pro). Orthogonal to profile.
# Membership in this group (not "ollama is installed") is what turns a machine
# into a medium inference backend. A host is in AT MOST ONE inference-role group.

# Bind Ollama on `inference_bind_ip` — which the host's TRANSPORT decides
# (G30 r4, MDP-4). Under `inference_transport: lan` (the default, and what a
# stationary wired box uses) that is the host's LAN IP from .env
# (MAC_<HOST>_LAN_IP): LiteLLM on Unraid reaches the backend over the wired LAN,
# the port is unauthenticated, so the LAN is the only interface it may listen on
# and the router at :4000 is the enforcement door. Under
# `inference_transport: tailnet` (a ROAMING host) it is 127.0.0.1 and nothing
# else (F-MDP4-2) — the remote door is `tailscale serve` into the loopback Caddy
# front, and the tailnet ACL is the auth. Either way it is NEVER 0.0.0.0:
# tasks/load-local-env.yml asserts that with no override (F-MDP4-3).
# If the required address is unset on a role host the run fails loudly (F15);
# -e allow_loopback=true waives that for `lan` laptop dev only, never `tailnet`.
ollama_bind: "{{ inference_bind_ip }}:11434"

# Keep the resident model loaded indefinitely (G19 latency requirement).
# See group_vars/inference_small.yml for why `-1` is necessary but NOT sufficient:
# at the slot cap ollama evicts the least-recently-used model regardless.
ollama_keep_alive: -1

# --- slot budget (sized from arithmetic, not left at ollama's default) --------
# This node serves exactly one alias (`medium`) from one ~22 GB model, and that
# is measurably why it has never been slow or flaky: one resident model, nothing
# contending. One slot codifies the healthy state. A second concurrent ~20 GB
# medium-tier load would be ~43 GB of 48 GB before KV cache — do not raise this
# without redoing the arithmetic.
ollama_max_loaded_models: 1

# NO dev-zoo instance here. The M1 Pro gets one (see inference_small) because its
# pipeline models were being evicted by ad-hoc experimentation. Adding an
# experimentation surface to THIS box is a boundary decision, not a capacity one
# (this is the sensitive inference node) — flip it deliberately or not at all.
ollama_dev_enabled: false

# Manifest roles this node may pull. Manifest entries with role `either` also
# qualify; entries with role `small` do not.
model_roles:
  - medium

# Free space (GB) that must remain after pulls (G26). Overridable per host.
reserve_floor_gb: 100
