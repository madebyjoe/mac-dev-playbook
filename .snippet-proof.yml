---
- name: Render the LiteLLM snippet for a host
  hosts: all
  connection: local
  gather_facts: false
  become: false
  pre_tasks:
    - name: Load local addressing
      ansible.builtin.import_tasks: tasks/load-local-env.yml
  tasks:
    - name: Resolve role
      ansible.builtin.set_fact:
        inference_role: "{{ 'small' if 'inference_small' in group_names else ('medium' if 'inference_medium' in group_names else '') }}"
    - name: Load manifest
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/model_manifest.yml"
        name: manifest
    - name: Select served models
      ansible.builtin.set_fact:
        litellm_models: >-
          {{ manifest.models | selectattr('engine', 'in', ['ollama', 'llamacpp', 'whisper'])
             | selectattr('role', 'in', [inference_role, 'either']) | list }}
    - name: Render snippet
      ansible.builtin.template:
        src: templates/litellm-snippet.yml.j2
        dest: "{{ lookup('env', 'RENDER_OUT') }}/{{ inventory_hostname }}.yml"
        mode: '0644'
