---
- name: Setup Mac
  hosts: all
  become: false

  # Ensure Homebrew paths are available for all tasks
  environment:
    PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

  vars:
    # Combine core + profile-specific packages
    homebrew_taps: "{{ (core_homebrew_taps | default([]) + profile_homebrew_taps | default([])) | unique }}"
    homebrew_packages: "{{ (core_homebrew_packages | default([]) + profile_homebrew_packages | default([])) | unique }}"
    homebrew_cask_apps: "{{ (core_homebrew_cask_apps | default([]) + profile_homebrew_cask_apps | default([])) | unique }}"
    mas_apps: "{{ (core_mas_apps | default([]) + profile_mas_apps | default([])) | unique }}"
    # Inference model system (F5/F6.1). Override model_manifest_path to point at a
    # synthetic manifest when testing.
    model_manifest_path: "{{ playbook_dir }}/model_manifest.yml"
    llamacpp_models_dir: "{{ ansible_env.HOME }}/.cache/llamacpp/models"
    llamacpp_log_dir: "{{ ansible_env.HOME }}/Library/Logs/llamacpp"

  pre_tasks:
    - name: Display installation plan
      ansible.builtin.debug:
        msg:
          - "Profile: {{ group_names }}"
          - "Total packages: {{ homebrew_packages | length }}"
          - "Total casks: {{ homebrew_cask_apps | length }}"
          - "Total MAS apps: {{ mas_apps | length }}"

    - name: Ensure Rosetta 2 is installed (Apple Silicon only)
      when: ansible_architecture == "arm64" or (cpu_arch.stdout | default('')) == "arm64"
      block:
        - name: Check CPU architecture
          ansible.builtin.command: uname -m
          register: cpu_arch
          changed_when: false

        - name: Check for Rosetta 2
          ansible.builtin.stat:
            path: /Library/Apple/usr/share/rosetta/rosetta
          register: rosetta_check

        - name: Install Rosetta 2
          ansible.builtin.command: softwareupdate --install-rosetta --agree-to-license
          become: true  # softwareupdate --install-rosetta requires root; play runs become:false
          when: not rosetta_check.stat.exists
          changed_when: true

    - name: Ensure Homebrew is installed
      ansible.builtin.stat:
        path: /opt/homebrew/bin/brew
      register: homebrew_check

    - name: Install Homebrew (if missing)
      ansible.builtin.shell: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      when: not homebrew_check.stat.exists
      changed_when: true

  tasks:
    # F9: each install runs in BULK first (one fast brew invocation). If the
    # bulk task fails, the rescue re-runs the same list PER ITEM to pinpoint and
    # record exactly which entries failed. The play then asserts every failure
    # list is empty, so a broken tap/package/cask/MAS app fails the run by
    # default. `-e soft_fail=true` downgrades the assert to a summary (the old
    # interactive behaviour).

    - name: Ensure Homebrew taps are present
      tags: ['homebrew']
      block:
        - name: Add Homebrew taps (bulk)
          community.general.homebrew_tap:
            name: "{{ homebrew_taps }}"
            state: present
          when: homebrew_taps | length > 0
      rescue:
        - name: Retry taps individually to identify failures
          community.general.homebrew_tap:
            name: "{{ item }}"
            state: present
          loop: "{{ homebrew_taps }}"
          register: tap_items
          failed_when: false
        - name: Record failed taps
          ansible.builtin.set_fact:
            failed_taps: >-
              {{ (tap_items.results | default([]))
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='item') | list }}

    - name: Ensure CLI packages are installed
      tags: ['homebrew']
      block:
        - name: Install CLI packages (bulk)
          community.general.homebrew:
            name: "{{ homebrew_packages }}"
            state: present
            update_homebrew: false
          when: homebrew_packages | length > 0
      rescue:
        - name: Retry packages individually to identify failures
          community.general.homebrew:
            name: "{{ item }}"
            state: present
            update_homebrew: false
          loop: "{{ homebrew_packages }}"
          register: package_items
          failed_when: false
        - name: Record failed packages
          ansible.builtin.set_fact:
            failed_packages: >-
              {{ (package_items.results | default([]))
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='item') | list }}

    - name: Ensure Cask applications are installed
      tags: ['homebrew']
      block:
        - name: Install casks (bulk)
          community.general.homebrew_cask:
            name: "{{ homebrew_cask_apps }}"
            state: present
            accept_external_apps: true
          when: homebrew_cask_apps | length > 0
      rescue:
        - name: Retry casks individually to identify failures
          community.general.homebrew_cask:
            name: "{{ item }}"
            state: present
            accept_external_apps: true
          loop: "{{ homebrew_cask_apps }}"
          register: cask_items
          failed_when: false
        - name: Record failed casks
          ansible.builtin.set_fact:
            failed_casks: >-
              {{ (cask_items.results | default([]))
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='item') | list }}

    # --- Mac App Store ---
    - name: Check if mas is installed (required for App Store apps)
      ansible.builtin.stat:
        path: /opt/homebrew/bin/mas
      register: mas_binary
      when: mas_apps | length > 0
      tags: ['mas']

    - name: Check if signed into App Store
      ansible.builtin.command: /opt/homebrew/bin/mas account
      register: mas_account
      failed_when: false
      changed_when: false
      when:
        - mas_apps | length > 0
        - mas_binary.stat.exists | default(false)
      tags: ['mas']

    - name: Warning if not signed into App Store
      ansible.builtin.debug:
        msg: "WARNING: Not signed into App Store; MAS apps will be skipped. Sign in via the App Store GUI first."
      when:
        - mas_apps | length > 0
        - (mas_account.rc | default(1)) != 0
      tags: ['mas']

    - name: Install Mac App Store apps
      community.general.mas:
        id: "{{ item.id }}"
        state: present
      loop: "{{ mas_apps }}"
      when:
        - mas_apps | length > 0
        - (mas_account.rc | default(1)) == 0
      register: mas_items
      failed_when: false
      tags: ['mas']

    - name: Record failed MAS apps
      ansible.builtin.set_fact:
        failed_mas: >-
          {{ (mas_items.results | default([]))
             | selectattr('failed', 'defined') | selectattr('failed')
             | map(attribute='item') | map(attribute='name') | list }}
      when: mas_apps | length > 0
      tags: ['mas']

    # --- Strict failure gate (F9) ---
    - name: Assert all installs succeeded (strict; -e soft_fail=true to bypass)
      ansible.builtin.assert:
        that:
          - (failed_taps | default([])) | length == 0
          - (failed_packages | default([])) | length == 0
          - (failed_casks | default([])) | length == 0
          - (failed_mas | default([])) | length == 0
        success_msg: "All taps, packages, casks, and MAS apps installed."
        fail_msg: >-
          Provisioning failed. failed_taps={{ failed_taps | default([]) }}
          failed_packages={{ failed_packages | default([]) }}
          failed_casks={{ failed_casks | default([]) }}
          failed_mas={{ failed_mas | default([]) }}
      when: not (soft_fail | default(false) | bool)
      tags: ['homebrew', 'mas']

    - name: Summary of failures (soft_fail mode)
      ansible.builtin.debug:
        msg:
          - "=== Installation Summary (soft_fail) ==="
          - "Failed taps: {{ failed_taps | default([]) }}"
          - "Failed packages: {{ failed_packages | default([]) }}"
          - "Failed casks: {{ failed_casks | default([]) }}"
          - "Failed MAS apps: {{ failed_mas | default([]) }}"
      when: soft_fail | default(false) | bool

    # Configuration tasks
    - name: Configure Ollama
      ansible.builtin.import_tasks: tasks/configure-ollama.yml
      # F3: work-profile (MDM-managed) machines never serve inference. Guard on
      # group membership in addition to the package condition.
      when:
        - "'ollama' in homebrew_packages"
        - "'work' not in group_names"
      tags: ['config', 'ollama']

    - name: Pull inference models (storage-aware)
      ansible.builtin.import_tasks: tasks/pull-models.yml
      when: >-
        ('work' not in group_names) and
        (('inference_small' in group_names) or ('inference_medium' in group_names))
      tags: ['ollama', 'models']

    - name: Configure llama.cpp services
      ansible.builtin.import_tasks: tasks/configure-llamacpp.yml
      when: >-
        ('work' not in group_names) and
        (('inference_small' in group_names) or ('inference_medium' in group_names))
      tags: ['config', 'llamacpp']

    - name: Emit LiteLLM router snippet
      ansible.builtin.import_tasks: tasks/litellm-artifact.yml
      when: >-
        ('work' not in group_names) and
        (('inference_small' in group_names) or ('inference_medium' in group_names))
      tags: ['ollama', 'litellm']

  handlers:
    # Bounce the Ollama service only when the plist actually changed (F7).
    # bootout + bootstrap in the gui/$UID domain replaces deprecated
    # launchctl unload/load; runs as the user, no root needed.
    - name: Restart Ollama
      ansible.builtin.shell: |
        uid=$(id -u)
        launchctl bootout "gui/${uid}/com.ollama.serve" 2>/dev/null || true
        launchctl bootstrap "gui/${uid}" "{{ ansible_env.HOME }}/Library/LaunchAgents/com.ollama.serve.plist"
      changed_when: true
