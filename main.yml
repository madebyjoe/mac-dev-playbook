---
- name: Setup Mac
  hosts: all
  become: false

  # Ensure Homebrew paths are available for all tasks
  environment:
    PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

  vars:
    # Combine core + profile-specific packages
    homebrew_taps: "{{ (core_homebrew_taps | default([]) + profile_homebrew_taps | default([])) | unique }}"
    homebrew_packages: "{{ (core_homebrew_packages | default([]) + profile_homebrew_packages | default([])) | unique }}"
    homebrew_cask_apps: "{{ (core_homebrew_cask_apps | default([]) + profile_homebrew_cask_apps | default([])) | unique }}"
    mas_apps: "{{ (core_mas_apps | default([]) + profile_mas_apps | default([])) | unique }}"
    # Inference model system (F5/F6.1). Override model_manifest_path to point at a
    # synthetic manifest when testing.
    model_manifest_path: "{{ playbook_dir }}/model_manifest.yml"
    # Where the planner + manifest are staged ON THE TARGET so they run against
    # the target's disk/ollama state (works for connection=local and =ssh).
    inference_workdir: "{{ ansible_facts.env.HOME }}/.cache/mac-dev-playbook"
    # Warm-keeper for the pinned pipeline models (Fault B mitigation 3). Rendered
    # on the target and driven by the com.ollama.warm launchd agent.
    ollama_warm_script: "{{ inference_workdir }}/ollama-warm.sh"
    llamacpp_models_dir: "{{ ansible_facts.env.HOME }}/.cache/llamacpp/models"
    llamacpp_log_dir: "{{ ansible_facts.env.HOME }}/Library/Logs/llamacpp"
    # transcribe (whisper-server) service — M1 Pro (T17). Model fetched from HF.
    whisper_models_dir: "{{ ansible_facts.env.HOME }}/.cache/whisper/models"
    whisper_log_dir: "{{ ansible_facts.env.HOME }}/Library/Logs/transcribe"
    # whisper-server's --convert writes its scratch WAV to a RELATIVE path, so the
    # service needs a writable working directory (launchd's default is /).
    whisper_work_dir: "{{ ansible_facts.env.HOME }}/.cache/whisper/run"
    whisper_model_base_url: "https://huggingface.co/ggerganov/whisper.cpp/resolve/main"
    # Loopback Caddy front for a ROAMING inference host (MDP-4 Phase B). Only
    # rendered where `inference_transport: tailnet`; see
    # runbooks/inference-front.md for why a Host-rewriting shim has to exist.
    inference_front_label: com.madebyjoe.inference-front
    inference_front_caddyfile: "{{ ansible_facts.env.HOME }}/.config/inference-front/Caddyfile"
    inference_front_log_dir: "{{ ansible_facts.env.HOME }}/Library/Logs/inference-front"

  pre_tasks:
    - name: Load local addressing (.env)
      ansible.builtin.import_tasks: tasks/load-local-env.yml
      tags: ['always']

    - name: Display installation plan
      ansible.builtin.debug:
        msg:
          - "Profile: {{ group_names }}"
          - "Total packages: {{ homebrew_packages | length }}"
          - "Total casks: {{ homebrew_cask_apps | length }}"
          - "Total MAS apps: {{ mas_apps | length }}"

    - name: Ensure Rosetta 2 is installed (Apple Silicon only)
      when: ansible_facts.architecture == "arm64" or (cpu_arch.stdout | default('')) == "arm64"
      block:
        - name: Check CPU architecture
          ansible.builtin.command: uname -m
          register: cpu_arch
          changed_when: false

        - name: Check for Rosetta 2
          ansible.builtin.stat:
            path: /Library/Apple/usr/share/rosetta/rosetta
          register: rosetta_check

        - name: Install Rosetta 2
          ansible.builtin.command: softwareupdate --install-rosetta --agree-to-license
          become: true  # softwareupdate --install-rosetta requires root; play runs become:false
          when: not rosetta_check.stat.exists
          changed_when: true

    - name: Ensure Homebrew is installed
      ansible.builtin.stat:
        path: /opt/homebrew/bin/brew
      register: homebrew_check

    - name: Install Homebrew (if missing)
      ansible.builtin.shell: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      when: not homebrew_check.stat.exists
      changed_when: true

  tasks:
    # F9: each install runs in BULK first (one fast brew invocation). If the
    # bulk task fails, the rescue re-runs the same list PER ITEM to pinpoint and
    # record exactly which entries failed. The play then asserts every failure
    # list is empty, so a broken tap/package/cask/MAS app fails the run by
    # default. `-e soft_fail=true` downgrades the assert to a summary (the old
    # interactive behaviour).

    - name: Ensure Homebrew taps are present
      tags: ['homebrew']
      block:
        - name: Add Homebrew taps (bulk)
          community.general.homebrew_tap:
            name: "{{ homebrew_taps }}"
            state: present
          when: homebrew_taps | length > 0
      rescue:
        - name: Retry taps individually to identify failures
          community.general.homebrew_tap:
            name: "{{ item }}"
            state: present
          loop: "{{ homebrew_taps }}"
          register: tap_items
          failed_when: false
        - name: Record failed taps
          ansible.builtin.set_fact:
            failed_taps: >-
              {{ (tap_items.results | default([]))
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='item') | list }}

    - name: Ensure CLI packages are installed
      tags: ['homebrew']
      block:
        - name: Install CLI packages (bulk)
          community.general.homebrew:
            name: "{{ homebrew_packages }}"
            state: present
            update_homebrew: false
          when: homebrew_packages | length > 0
      rescue:
        - name: Retry packages individually to identify failures
          community.general.homebrew:
            name: "{{ item }}"
            state: present
            update_homebrew: false
          loop: "{{ homebrew_packages }}"
          register: package_items
          failed_when: false
        - name: Record failed packages
          ansible.builtin.set_fact:
            failed_packages: >-
              {{ (package_items.results | default([]))
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='item') | list }}

    - name: Ensure Cask applications are installed
      tags: ['homebrew']
      block:
        - name: Install casks (bulk)
          community.general.homebrew_cask:
            name: "{{ homebrew_cask_apps }}"
            state: present
            accept_external_apps: true
          when: homebrew_cask_apps | length > 0
      rescue:
        - name: Retry casks individually to identify failures
          community.general.homebrew_cask:
            name: "{{ item }}"
            state: present
            accept_external_apps: true
          loop: "{{ homebrew_cask_apps }}"
          register: cask_items
          failed_when: false
        - name: Record failed casks
          ansible.builtin.set_fact:
            failed_casks: >-
              {{ (cask_items.results | default([]))
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='item') | list }}

    # --- Mac App Store ---
    - name: Check if mas is installed (required for App Store apps)
      ansible.builtin.stat:
        path: /opt/homebrew/bin/mas
      register: mas_binary
      when: mas_apps | length > 0
      tags: ['mas']

    - name: Check if signed into App Store
      ansible.builtin.command: /opt/homebrew/bin/mas account
      register: mas_account
      failed_when: false
      changed_when: false
      when:
        - mas_apps | length > 0
        - mas_binary.stat.exists | default(false)
      tags: ['mas']

    - name: Warning if not signed into App Store
      ansible.builtin.debug:
        msg: "WARNING: Not signed into App Store; MAS apps will be skipped. Sign in via the App Store GUI first."
      when:
        - mas_apps | length > 0
        - (mas_account.rc | default(1)) != 0
      tags: ['mas']

    - name: Install Mac App Store apps
      community.general.mas:
        id: "{{ item.id }}"
        state: present
      loop: "{{ mas_apps }}"
      when:
        - mas_apps | length > 0
        - (mas_account.rc | default(1)) == 0
      register: mas_items
      failed_when: false
      tags: ['mas']

    - name: Record failed MAS apps
      ansible.builtin.set_fact:
        failed_mas: >-
          {{ (mas_items.results | default([]))
             | selectattr('failed', 'defined') | selectattr('failed')
             | map(attribute='item') | map(attribute='name') | list }}
      when: mas_apps | length > 0
      tags: ['mas']

    # --- Strict failure gate (F9) ---
    - name: Assert all installs succeeded (strict; -e soft_fail=true to bypass)
      ansible.builtin.assert:
        that:
          - (failed_taps | default([])) | length == 0
          - (failed_packages | default([])) | length == 0
          - (failed_casks | default([])) | length == 0
          - (failed_mas | default([])) | length == 0
        success_msg: "All taps, packages, casks, and MAS apps installed."
        fail_msg: >-
          Provisioning failed. failed_taps={{ failed_taps | default([]) }}
          failed_packages={{ failed_packages | default([]) }}
          failed_casks={{ failed_casks | default([]) }}
          failed_mas={{ failed_mas | default([]) }}
      when: not (soft_fail | default(false) | bool)
      tags: ['homebrew', 'mas']

    - name: Summary of failures (soft_fail mode)
      ansible.builtin.debug:
        msg:
          - "=== Installation Summary (soft_fail) ==="
          - "Failed taps: {{ failed_taps | default([]) }}"
          - "Failed packages: {{ failed_packages | default([]) }}"
          - "Failed casks: {{ failed_casks | default([]) }}"
          - "Failed MAS apps: {{ failed_mas | default([]) }}"
      when: soft_fail | default(false) | bool

    # --- non-Homebrew global installs (every profile, work included) ---
    - name: Install herdr
      ansible.builtin.import_tasks: tasks/install-herdr.yml
      tags: ['herdr']

    # Configuration tasks
    - name: Configure Ollama
      ansible.builtin.import_tasks: tasks/configure-ollama.yml
      # F3: work-profile (MDM-managed) machines never serve inference. Guard on
      # group membership in addition to the package condition.
      when:
        - "'ollama' in homebrew_packages"
        - "'work' not in group_names"
      tags: ['config', 'ollama']

    - name: Pull inference models (storage-aware)
      ansible.builtin.import_tasks: tasks/pull-models.yml
      when: >-
        ('work' not in group_names) and
        (('inference_small' in group_names) or ('inference_medium' in group_names))
      tags: ['ollama', 'models']

    # Runs AFTER the pulls: the models have to exist before residency can be
    # asserted (M1 Pro remediation, Fault B).
    - name: Verify the Ollama residency invariant
      ansible.builtin.import_tasks: tasks/verify-ollama-residency.yml
      when: >-
        ('work' not in group_names) and
        (('inference_small' in group_names) or ('inference_medium' in group_names))
      tags: ['ollama', 'models', 'verify']

    - name: Configure llama.cpp services
      ansible.builtin.import_tasks: tasks/configure-llamacpp.yml
      when: >-
        ('work' not in group_names) and
        (('inference_small' in group_names) or ('inference_medium' in group_names))
      tags: ['config', 'llamacpp']

    - name: Configure transcribe (whisper-server) service
      ansible.builtin.import_tasks: tasks/configure-transcribe.yml
      when: >-
        ('work' not in group_names) and
        ('inference_small' in group_names)
      tags: ['config', 'transcribe']

    # A roaming host binds every inference service on 127.0.0.1, so it needs a
    # door: `tailscale serve` (TCP) into a loopback Caddy that rewrites the Host
    # header ollama would otherwise 403. Stationary `lan` hosts skip all of this
    # and keep reaching the LAN bind directly.
    - name: Configure the roaming inference front (Caddy + tailscale serve)
      ansible.builtin.import_tasks: tasks/configure-inference-front.yml
      when: >-
        ('work' not in group_names) and
        (inference_transport == 'tailnet') and
        ((group_names | select('match', '^inference_') | list | length) > 0)
      tags: ['config', 'inference-front']

    - name: Emit LiteLLM router snippet
      ansible.builtin.import_tasks: tasks/litellm-artifact.yml
      when: >-
        ('work' not in group_names) and
        (('inference_small' in group_names) or ('inference_medium' in group_names))
      tags: ['ollama', 'litellm']

    # Runs at the END, like verify-ollama-residency.yml: the front can only be
    # verified once ollama, Caddy and the serve rule are all in place.
    - name: Verify the roaming inference front
      ansible.builtin.import_tasks: tasks/verify-inference-front.yml
      when: >-
        ('work' not in group_names) and
        (inference_transport == 'tailnet') and
        ((group_names | select('match', '^inference_') | list | length) > 0)
      tags: ['config', 'inference-front', 'verify']

    - name: Enforce macOS preference-domain hygiene
      ansible.builtin.import_tasks: tasks/configure-macos-prefs.yml
      # GUI profiles only. Guard positively: headless inventories use varying
      # group names ('headless', 'headless-remote'), so a negative test leaks.
      when: >-
        ('personal' in group_names) or ('work' in group_names)
      tags: ['config', 'macos-prefs']

  handlers:
    # Bounce the Ollama service only when the plist actually changed (F7).
    # bootout + bootstrap in the gui/$UID domain replaces deprecated
    # launchctl unload/load; runs as the user, no root needed.
    - name: Restart Ollama
      ansible.builtin.shell: |
        uid=$(id -u)
        plist="{{ ansible_facts.env.HOME }}/Library/LaunchAgents/com.ollama.serve.plist"
        launchctl bootout "gui/${uid}/com.ollama.serve" 2>/dev/null || true
        # bootout is async; bootstrapping before it finishes returns
        # "Bootstrap failed: 5: Input/output error". Wait for it to unload first.
        for _ in $(seq 1 20); do
          launchctl print "gui/${uid}/com.ollama.serve" >/dev/null 2>&1 || break
          sleep 0.3
        done
        launchctl bootstrap "gui/${uid}" "$plist"
      changed_when: true

    # The dev-zoo instance (:11435). Same bootout/bootstrap dance, own label.
    # Bouncing this NEVER touches the pipeline instance's resident models --
    # which is the entire point of running two of them.
    - name: Restart Ollama dev
      ansible.builtin.shell: |
        uid=$(id -u)
        plist="{{ ansible_facts.env.HOME }}/Library/LaunchAgents/com.ollama.dev.plist"
        launchctl bootout "gui/${uid}/com.ollama.dev" 2>/dev/null || true
        for _ in $(seq 1 20); do
          launchctl print "gui/${uid}/com.ollama.dev" >/dev/null 2>&1 || break
          sleep 0.3
        done
        launchctl bootstrap "gui/${uid}" "$plist"
      changed_when: true

    # The periodic warm-keeper agent (StartInterval, not a daemon).
    - name: Restart Ollama warm-keeper
      ansible.builtin.shell: |
        uid=$(id -u)
        plist="{{ ansible_facts.env.HOME }}/Library/LaunchAgents/com.ollama.warm.plist"
        launchctl bootout "gui/${uid}/com.ollama.warm" 2>/dev/null || true
        for _ in $(seq 1 20); do
          launchctl print "gui/${uid}/com.ollama.warm" >/dev/null 2>&1 || break
          sleep 0.3
        done
        launchctl bootstrap "gui/${uid}" "$plist"
      changed_when: true

    # Restart transcribe only when its plist changed AND the model file is
    # present (a dry/check run renders the plist but must not start a modelless
    # server that would crash-loop under KeepAlive).
    - name: Restart transcribe
      ansible.builtin.shell: |
        uid=$(id -u)
        label="com.inference.transcribe"
        plist="{{ ansible_facts.env.HOME }}/Library/LaunchAgents/${label}.plist"
        model="{{ whisper_models_dir }}/{{ whisper_model_file | default('') }}"
        [ -f "$model" ] || exit 0
        launchctl bootout "gui/${uid}/${label}" 2>/dev/null || true
        # bootout is ASYNC. Bootstrapping before it finishes returns
        # "Bootstrap failed: 5: Input/output error" and leaves :8082 DOWN -- the
        # same race the Restart Ollama handler documents. Drain first.
        for _ in $(seq 1 20); do
          launchctl print "gui/${uid}/${label}" >/dev/null 2>&1 || break
          sleep 0.3
        done
        # Then retry the bootstrap itself: unlike ollama, whisper-server holds a
        # listening socket (:8082), and the port can linger briefly after the job
        # is gone, which fails the bootstrap for a second or two.
        err=$(mktemp)
        for attempt in $(seq 1 10); do
          if launchctl bootstrap "gui/${uid}" "$plist" 2>"$err"; then
            rm -f "$err"
            exit 0
          fi
          sleep 1
        done
        echo "bootstrap failed after 10 attempts:" >&2
        cat "$err" >&2; rm -f "$err"
        exit 1
      changed_when: true

    # The loopback Caddy front. `admin off` in the Caddyfile means there is no
    # admin API, and `caddy reload` needs one -- so a config change is applied by
    # bouncing the job. kickstart -k restarts a loaded job in place; if the job
    # is not loaded yet (first run, or someone booted it out) bootstrap it
    # instead, because kickstart on an unknown label just errors.
    - name: Restart inference front
      ansible.builtin.shell: |
        uid=$(id -u)
        label="{{ inference_front_label }}"
        plist="{{ ansible_facts.env.HOME }}/Library/LaunchAgents/${label}.plist"
        if launchctl print "gui/${uid}/${label}" >/dev/null 2>&1; then
          launchctl kickstart -k "gui/${uid}/${label}"
        else
          launchctl bootstrap "gui/${uid}" "$plist"
        fi
      changed_when: true

    # symbolichotkeys changes only reach the running session after the
    # settings daemon is poked; otherwise they apply at next login.
    - name: Activate macOS settings
      ansible.builtin.command:
        cmd: /System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u
      changed_when: true
