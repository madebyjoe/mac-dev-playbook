---
# Storage-aware model pulls (F5/F6.1). Runs the deterministic planner to produce
# a JSON plan, shows it, then pulls ONLY the models the planner selected: ollama
# entries via `ollama pull`, llamacpp entries via `huggingface-cli download`
# (async, per the existing 30-min pattern). The planner never deletes; eviction
# is a human decision surfaced as a recommendation. Pulls happen only when the
# human sets `model_pull_dry_run=false` — the default is a dry plan with no pulls.

- name: Resolve this host's inference role
  ansible.builtin.set_fact:
    inference_role: "{{ 'small' if 'inference_small' in group_names else ('medium' if 'inference_medium' in group_names else '') }}"

- name: Plan and pull inference models
  when: inference_role != ''
  block:
    # The planner must run ON THE TARGET so it sees the target's `ollama list`,
    # free disk, and (llamacpp) present files — not the control node's. Stage the
    # stdlib planner + the manifest to a target work dir so this works under both
    # connection=local and connection=ssh. check_mode:false so a --check run can
    # still stage the (harmless, read-only) helpers and show the plan.
    - name: Ensure the planner work dir exists on the target
      ansible.builtin.file:
        path: "{{ inference_workdir }}"
        state: directory
        mode: '0755'
      check_mode: false

    - name: Stage the planner and manifest on the target
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ inference_workdir }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: "{{ playbook_dir }}/scripts/plan_model_pulls.py", dest: "plan_model_pulls.py", mode: "0755" }
        - { src: "{{ model_manifest_path }}", dest: "model_manifest.yml", mode: "0644" }
      loop_control:
        label: "{{ item.dest }}"
      check_mode: false

    - name: Run the model-pull planner (non-destructive; JSON to stdout)
      ansible.builtin.command:
        argv:
          - python3
          - "{{ inference_workdir }}/plan_model_pulls.py"
          - "--manifest"
          - "{{ inference_workdir }}/model_manifest.yml"
          - "--role"
          - "{{ inference_role }}"
          - "--models-dir"
          - "{{ ollama_models_dir | default(ansible_facts.env.HOME + '/.ollama/models') }}"
          - "--llamacpp-models-dir"
          - "{{ llamacpp_models_dir }}"
          - "--reserve-floor-gb"
          - "{{ reserve_floor_gb | default(100) }}"
          - "--format"
          - "json"
          - "--dry-run"
      register: model_plan_raw
      changed_when: false
      check_mode: false  # read-only planner; safe and needed under --check

    - name: Parse the JSON plan
      ansible.builtin.set_fact:
        model_plan: "{{ model_plan_raw.stdout | from_json }}"

    - name: Show the plan (human-readable)
      ansible.builtin.debug:
        msg: "{{ model_plan_raw.stderr_lines }}"

    # Pulls are gated behind model_pull_dry_run (default true). The executor
    # never runs these live; it is the human's call at review time.
    - name: Pull selected ollama models (async, 30 min each)
      ansible.builtin.command: "ollama pull {{ item.name }}"
      loop: "{{ model_plan.pull | selectattr('engine', 'equalto', 'ollama') | list }}"
      loop_control:
        label: "{{ item.name }}"
      when: not (model_pull_dry_run | default(true) | bool)
      register: ollama_pull
      changed_when: "'pulling manifest' in (ollama_pull.stdout | default(''))"
      async: 1800
      poll: 30

    - name: Download selected llama.cpp GGUF quants (async, 30 min each)
      ansible.builtin.command:
        argv:
          - huggingface-cli
          - download
          - "{{ item.hf_repo }}"
          - "{{ item.quant_file }}"
          - "--local-dir"
          - "{{ llamacpp_models_dir }}"
      loop: "{{ model_plan.pull | selectattr('engine', 'equalto', 'llamacpp') | list }}"
      loop_control:
        label: "{{ item.name }}"
      when: not (model_pull_dry_run | default(true) | bool)
      changed_when: true
      async: 1800
      poll: 30

    # Reconcile declared size_gb against actual on-disk size (both engines) and
    # warn on >20% divergence, feeding manifest corrections back to the human.
    - name: Verify pulled model sizes against the manifest
      ansible.builtin.command:
        argv:
          - python3
          - "{{ inference_workdir }}/plan_model_pulls.py"
          - "--manifest"
          - "{{ inference_workdir }}/model_manifest.yml"
          - "--role"
          - "{{ inference_role }}"
          - "--llamacpp-models-dir"
          - "{{ llamacpp_models_dir }}"
          - "--verify"
      register: model_verify_raw
      changed_when: false
      check_mode: false
      when: not (model_pull_dry_run | default(true) | bool)

    - name: Report size divergences (if any)
      ansible.builtin.debug:
        msg: "{{ model_verify_raw.stderr_lines | default([]) }}"
      when:
        - not (model_pull_dry_run | default(true) | bool)
        - (model_verify_raw.stderr_lines | default([])) | length > 0
