---
- name: Check if Ollama is installed
  ansible.builtin.command: which ollama
  register: ollama_check
  failed_when: false
  changed_when: false
  check_mode: false  # read-only probe; must run under --check so the block gates correctly

- name: Configure Ollama launchd service
  when: ollama_check.rc == 0
  block:
    - name: Ensure LaunchAgents directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/Library/LaunchAgents"
        state: directory
        mode: '0755'

    - name: Ensure Ollama log directory exists
      ansible.builtin.file:
        path: "{{ ollama_log_dir | default(ansible_facts.env.HOME + '/Library/Logs/ollama') }}"
        state: directory
        mode: '0755'

    # Take over from any hand-rolled ollama launchd service (e.g. a com.ollama or
    # local.ollama plist binding 0.0.0.0 from a manual setup). Every LaunchAgents
    # *.plist that runs `ollama serve` / sets OLLAMA_HOST, EXCEPT our own
    # com.ollama.serve, is booted out and renamed aside — otherwise the old one
    # keeps :11434 and our LAN bind never takes effect (and bootstrap fails).
    # Renamed to .disabled-by-playbook (not deleted) so it is recoverable; see
    # runbooks/ollama.md. Skipped under --check (it mutates launchd/files).
    - name: Disable conflicting legacy ollama launchd services
      ansible.builtin.shell: |
        set -o pipefail
        uid=$(id -u)
        la="{{ ansible_facts.env.HOME }}/Library/LaunchAgents"
        changed=0
        for f in "$la"/*.plist; do
          [ -e "$f" ] || continue
          [ "$(basename "$f")" = "com.ollama.serve.plist" ] && continue
          if grep -qi 'ollama' "$f" && grep -qiE '>serve<|OLLAMA_HOST' "$f"; then
            label=$(/usr/libexec/PlistBuddy -c 'Print :Label' "$f" 2>/dev/null || true)
            [ -n "$label" ] && launchctl bootout "gui/${uid}/${label}" 2>/dev/null || true
            mv "$f" "${f}.disabled-by-playbook"
            echo "disabled $(basename "$f") (label=${label:-unknown})"
            changed=1
          fi
        done
        [ "$changed" = 1 ] && echo RESULT_CHANGED || true
      register: ollama_legacy
      changed_when: "'RESULT_CHANGED' in ollama_legacy.stdout"

    # Templating the plist only NOTIFIES the restart handler. The service is
    # bounced (bootout + bootstrap, dropping resident models) exclusively when
    # the rendered plist actually changes -- not on every run (F7).
    - name: Template Ollama launchd plist
      ansible.builtin.template:
        src: templates/ollama.plist.j2
        dest: "{{ ansible_facts.env.HOME }}/Library/LaunchAgents/com.ollama.serve.plist"
        mode: '0644'
      notify: Restart Ollama

    # Idempotent load: bootstrap the service only if it is not already loaded.
    # This does NOT bounce a running service, so residency is preserved.
    - name: Ensure Ollama service is bootstrapped
      ansible.builtin.shell: |
        uid=$(id -u)
        if ! launchctl print "gui/${uid}/com.ollama.serve" >/dev/null 2>&1; then
          launchctl bootstrap "gui/${uid}" "{{ ansible_facts.env.HOME }}/Library/LaunchAgents/com.ollama.serve.plist"
          echo bootstrapped
        fi
      register: ollama_bootstrap
      changed_when: "'bootstrapped' in ollama_bootstrap.stdout"

    # Positive confirmation that ollama actually came up on its bind address, so a
    # run does not just "mostly pass" while the service is unreachable. Retries
    # absorb async startup; a real failure to serve fails the run loudly (F9).
    - name: Wait for Ollama to answer on its bind address
      ansible.builtin.uri:
        url: "http://{{ (ollama_bind | default('127.0.0.1:11434')).split(':')[0] }}:11434/api/tags"
        status_code: 200
      register: ollama_ready
      retries: 15
      delay: 2
      until: ollama_ready.status == 200
      when: not ansible_check_mode

    # A role node binds the LAN IP only (G30), so 127.0.0.1 / the CLI / the
    # menu-bar app cannot reach it. Say so plainly so the run is self-explanatory.
    - name: Report where Ollama is serving
      ansible.builtin.debug:
        msg:
          - "Ollama is serving on {{ ollama_bind | default('127.0.0.1:11434') }}"
          - "This is an inference-role node: it binds the LAN IP only (G30), NOT 127.0.0.1."
          - "Local CLI on this box: export OLLAMA_HOST={{ ollama_bind | default('127.0.0.1:11434') }}"
          - "The menu-bar Ollama.app defaults to 127.0.0.1 and will NOT reach it."
      when: >-
        ('inference_small' in group_names) or
        ('inference_medium' in group_names)

    # Inference nodes must not sleep on AC or they drop off the tailnet. Applied
    # only to hosts in an inference-role group (F4); requires root.
    - name: Prevent system sleep on AC power (inference nodes only)
      become: true
      ansible.builtin.command: pmset -c sleep 0
      when: >-
        ('inference_small' in group_names) or
        ('inference_medium' in group_names)
      changed_when: false
      tags: ['power']
